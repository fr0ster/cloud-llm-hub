<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ABAP Dump Monitor</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script
    id="sap-ui-bootstrap"
    src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.fe.templates"
    data-sap-ui-async="true"
    data-sap-ui-resourceroots='{"monitor": "./"}'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-frameOptions="trusted">
  </script>
</head>
<body class="sapUiBody">
  <div data-sap-ui-component data-name="monitor" data-id="container" data-settings='{"id":"monitor"}' style="height:100%"></div>
</body>
</html>
