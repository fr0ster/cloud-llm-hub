_schema-version: 3.3.0
ID: abap-dump-monitor
version: 1.0.0
description: "abap-dump-monitor — scheduled-pull ABAP dump monitor via cloud-llm-hub + Jira"
parameters:
  enable-parallel-deployments: true
  CLOUD_LLM_HUB_URL: ""
  CLOUD_LLM_HUB_CLIENT_ID: ""
  CLOUD_LLM_HUB_CLIENT_SECRET: ""
  CLOUD_LLM_HUB_TOKEN_URL: ""
  JIRA_URL: "https://jiraeu.epam.com"
  JIRA_USER: ""
  JIRA_TOKEN: ""
  CF_LANDSCAPE: "cfapps.eu10-004.hana.ondemand.com"
  # Approuter host = <tenant-subdomain>-<APP_SUFFIX>.<CF_LANDSCAPE>.
  # The leading <tenant-subdomain>- segment is required by TENANT_HOST_PATTERN
  # (shared-tenant xsuaa). Override APPROUTER_HOST in .mtaext per subaccount.
  APPROUTER_HOST: "abap-dump-monitor"
  APP_SUFFIX: "abap-dump-monitor"

modules:
  - name: abap-dump-monitor-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 1G
    properties:
      SAP_SYSTEM_ID: "E19.100"
      SAP_DESTINATION: "S4HANA_E19"
      CLOUD_LLM_HUB_DESTINATION: "CLOUD_LLM_HUB"
      JIRA_DESTINATION: "JIRA_EPAM"
      # Used to render clickable Jira issue links on Object Page (jiraIssueUrl
      # virtual field). Same value as the Jira destination URL.
      JIRA_URL: ${JIRA_URL}
      NODE_OPTIONS: "--max-old-space-size=896"
    build-parameters:
      builder: custom
      commands:
        - node -e "require('fs').cpSync('../../app/monitor/webapp','app/monitor/webapp',{recursive:true});require('fs').cpSync('../../app/fiori-apps.html','app/fiori-apps.html')"
        - npm install
        - node -e "require('fs').writeFileSync('tsconfig.json',JSON.stringify({compilerOptions:{target:'ES2022',module:'CommonJS',moduleResolution:'Node',esModuleInterop:true,skipLibCheck:true,resolveJsonModule:true,outDir:'.tsbuild',rootDir:'srv'},include:['srv/**/*.ts']}))"
        - npx tsc -p tsconfig.json
        - node -e "const fs=require('fs');for(const f of fs.readdirSync('srv')){if(f.endsWith('.ts'))fs.unlinkSync(`srv/${f}`)}for(const f of fs.readdirSync('.tsbuild')){fs.copyFileSync(`.tsbuild/${f}`,`srv/${f}`)}"
        - node -e "require('fs').rmSync('.tsbuild',{recursive:true,force:true});require('fs').unlinkSync('tsconfig.json')"
        - bash -c "npx cds compile ../../srv/monitor-service.cds --to sql --dialect sqlite > srv/schema.sql && wc -l srv/schema.sql"
        - npm prune --omit=dev
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: abap-dump-monitor-auth
      - name: abap-dump-monitor-destination

  - name: abap-dump-monitor-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      disk-quota: 256M
      memory: 256M
      routes:
        - route: ${APPROUTER_HOST}-${space}.${CF_LANDSCAPE}
    build-parameters:
      builder: custom
      commands:
        - npm install --omit=dev
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          # Backend request timeout (ms). Default 30000 is too short for
          # synchronous LLM analysis (15-40s). Approuter reads this from the
          # destination object itself (lib/utils/destination-normalization.js).
          timeout: 180000
      - name: abap-dump-monitor-auth

resources:
  - name: abap-dump-monitor-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: abap-dump-monitor-${space-guid}
        tenant-mode: dedicated

  - name: abap-dump-monitor-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            # 'ignore' keeps existing destinations untouched on redeploys — credentials
            # drift (rotated keys etc.) is preserved. Switch to 'update' for one-shot
            # refresh, then back to 'ignore'.
            existing_destinations_policy: ignore
            destinations:
              - Name: CLOUD_LLM_HUB
                Type: HTTP
                URL: ${CLOUD_LLM_HUB_URL}
                ProxyType: Internet
                Authentication: OAuth2ClientCredentials
                clientId: ${CLOUD_LLM_HUB_CLIENT_ID}
                clientSecret: ${CLOUD_LLM_HUB_CLIENT_SECRET}
                tokenServiceURL: ${CLOUD_LLM_HUB_TOKEN_URL}
              - Name: JIRA_EPAM
                Type: HTTP
                URL: ${JIRA_URL}
                ProxyType: Internet
                Authentication: BasicAuthentication
                User: ${JIRA_USER}
                Password: ${JIRA_TOKEN}
