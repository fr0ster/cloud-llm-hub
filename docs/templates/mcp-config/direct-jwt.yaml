# Template: Direct SAP connection using JWT authentication
settingsPath: ~/.config/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json
mcpConnection:
  endpoint: https://example.proxy.local/mcp/stream/http
  definition:
    type: stream
    description: Direct SAP via JWT
  auth:
    type: basic
    username:
      source:
        type: const
        value: mcp-user@example.com
    password:
      source:
        type: const
        value: change-me
abapConnection:
  mode: direct
  direct:
    url: https://my.sap.system.example.com
    client: 100
    systemType: cloud    # x-sap-system-type: an ABAP Cloud system (declared by this template)
  auth:
    type: jwt
    token:
      source:
        type: file
        path: ./tokens/sap.jwt
      # Re-run the generator with --abap-token-source service to inject a CF service key reference
