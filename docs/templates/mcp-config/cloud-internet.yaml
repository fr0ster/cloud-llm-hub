# Template: Cloud deployment with direct ABAP URL (JWT)
settingsPath: ~/.config/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json
mcpConnection:
  endpoint: https://<your-approuter-host>/mcp/stream/http
  definition:
    type: stream
    description: Cloud MCP → ABAP via direct URL
    # Switch to "sse" when the MCP endpoint provides Server-Sent Events; remove the auth block below in that case
  auth:
    type: bearer
    token:
      source:
        type: service | file
        name: mcpXsuaa # Service name for cf service-key; drop jsonPath if you read from a file
        jsonPath: access_token # Token field inside the service key JSON; remove for file source
    # Delete this entire auth block when definition.type is "sse"
abapConnection:
  mode: direct
  direct:
    url: https://my.sap.system.example.com
    client: 100
  auth:
    type: jwt
    token:
      source:
        type: service | file
        name: sapAbap # CF service instance name; remove jsonPath when using file source
        jsonPath: credentials.jwt # JWT property path; omit for file-based token
