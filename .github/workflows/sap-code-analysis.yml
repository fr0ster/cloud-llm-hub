name: SAP Code Analysis

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure MCP Connection
        run: |
          node tools/update-cline-connection.js \
            --connection sap-ci \
            --settings .github/.cline-settings.json \
            --sap-token ${{ secrets.SAP_JWT_TOKEN }} \
            --mcp-token ${{ secrets.MCP_XSUAA_TOKEN }} \
            --destination-name ${{ secrets.SAP_DESTINATION }}
        env:
          SAP_DESTINATION: ${{ secrets.SAP_DESTINATION }}

      - name: Run Impact Analysis
        run: |
          node scripts/analyze-pr-changes.js \
            --settings .github/.cline-settings.json \
            --connection sap-ci \
            --pr-number ${{ github.event.pull_request.number }}
        env:
          MCP_ENDPOINT: ${{ secrets.MCP_ENDPOINT }}

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-report
          path: analysis-report.md

      - name: Comment PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('analysis-report.md')) {
              const analysis = fs.readFileSync('analysis-report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 📊 SAP Code Analysis\n\n' + analysis
              });
            }
