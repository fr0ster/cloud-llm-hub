name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Run linter (Biome)
        run: npx biome check --config-path . srv tools test
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Check docs against the project
        run: node tools/check-docs.js

      # Unit tests were NOT part of this workflow, which is how a test reading a
      # fixture that was never committed reached review with CI green. Lint and
      # tsc cannot see a missing file that is only read at runtime.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npx cds build
      
      - name: Summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "- Biome: OK"
          echo "- TypeScript: OK"
          echo "- Docs: OK"
          echo "- Build: OK"
