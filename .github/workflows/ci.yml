name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Run linter (Biome)
        run: npm run lint:check
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Build
        run: npx cds build
      
      - name: Summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "- Biome: OK"
          echo "- TypeScript: OK"
          echo "- Build: OK"
