name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Auto-format code
        run: npm run format
      
      - name: Check for formatting changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Code formatting issues found. Run 'npm run format' locally."
            git diff
            exit 1
          else
            echo "✅ Code formatting is correct"
          fi
      
      - name: Run linter (without prettier)
        run: npx eslint . --ext .ts,.js,.mjs --max-warnings 100
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Build
        run: npx cds build
      
      - name: Summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "- Code formatting: OK"
          echo "- ESLint: OK (max 100 warnings)"
          echo "- TypeScript: OK"
          echo "- Build: OK"
