_schema-version: 3.3.0
ID: cloud-llm-hub
version: 6.15.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  # LLM Agent deployment parameters (values provided via .mtaext)
  # LLM provider: "sap-ai-sdk" (default) or "openai" (any OpenAI-compatible API)
  LLM_AGENT_PROVIDER: "sap-ai-sdk"
  LLM_AGENT_MODEL:
  LLM_AGENT_TEMPERATURE:
  # For openai provider: API key and base URL — set via cf set-env (secrets!)
  # cf set-env cloud-llm-hub-srv LLM_AGENT_API_KEY "sk-..."
  # cf set-env cloud-llm-hub-srv LLM_AGENT_BASE_URL "https://api.openai.com/v1"
  LLM_AGENT_MAX_TOKENS:
  LLM_AGENT_MCP_DESTINATION:
  LLM_AGENT_MODE:
  LLM_AGENT_MAX_ITERATIONS:
  LLM_AGENT_RAG_TYPE:
  LLM_AGENT_RESOURCE_GROUP: "default"
  LLM_AGENT_CLASSIFIER_MODEL:
  LLM_AGENT_EMBEDDING_MODEL:
  LLM_AGENT_PRESENTATION_MODEL:
  LLM_AGENT_HISTORY_RECENCY_WINDOW:
  LLM_AGENT_RAG_QUERY_K:
  LLM_AGENT_PIPELINE_MODE: "default"
  # System-to-destination mapping: "DEV.100=S4HANA_DEV,QAS.600=S4HANA_QAS"
  DESTINATION_MAPPING: ""
  # AI Core credentials: set via cf set-env (not in .mtaext — secrets!)
  # cf set-env cloud-llm-hub-srv AICORE_AUTH_URL "https://..."
  # cf set-env cloud-llm-hub-srv AICORE_CLIENT_ID "sb-..."
  # cf set-env cloud-llm-hub-srv AICORE_CLIENT_SECRET "..."
  # cf set-env cloud-llm-hub-srv AICORE_BASE_URL "https://api.ai..."
  # Not needed when AI Core service binding exists (VCAP_SERVICES takes priority)
  #
  # CF landscape and approuter route host (override in .mtaext per subaccount)
  CF_LANDSCAPE: "cfapps.eu10.hana.ondemand.com"
  APPROUTER_HOST: "cloud-llm-hub"
build-parameters:
  before-all:
    - builder: custom
      commands:
        - node -e "try{require('fs').rmSync('node_modules',{recursive:true,force:true,maxRetries:3,retryDelay:1000})}catch{}"
        - npm ci
        - npx cds build --production
        - node -e "require('fs').cpSync('app/chat/webapp','gen/srv/app/chat/webapp',{recursive:true})"
modules:
  - name: cloud-llm-hub-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      # Explicit per-subaccount route so the srv URL reflects the subaccount
      # (e.g. acme-subaccount-cloud-llm-hub-srv) instead of the generic
      # CF default org-name route (acme-org...-sn-<random-guid>), which is
      # confusing (looks like another account) and unstable across redeploys.
      # The proxy targetUrl points here, so a stable, named route matters.
      routes:
        - route: ${APPROUTER_HOST}-srv.${CF_LANDSCAPE}
    properties:
      # LLM Agent Configuration (values from .mtaext via global parameters)
      LLM_AGENT_PROVIDER: ${LLM_AGENT_PROVIDER}
      LLM_AGENT_MODEL: ${LLM_AGENT_MODEL}
      LLM_AGENT_TEMPERATURE: ${LLM_AGENT_TEMPERATURE}
      LLM_AGENT_MAX_TOKENS: ${LLM_AGENT_MAX_TOKENS}
      LLM_AGENT_MCP_DESTINATION: ${LLM_AGENT_MCP_DESTINATION}
      LLM_AGENT_MODE: ${LLM_AGENT_MODE}
      LLM_AGENT_MAX_ITERATIONS: ${LLM_AGENT_MAX_ITERATIONS}
      LLM_AGENT_RAG_TYPE: ${LLM_AGENT_RAG_TYPE}
      LLM_AGENT_RESOURCE_GROUP: ${LLM_AGENT_RESOURCE_GROUP}
      LLM_AGENT_CLASSIFIER_MODEL: ${LLM_AGENT_CLASSIFIER_MODEL}
      LLM_AGENT_EMBEDDING_MODEL: ${LLM_AGENT_EMBEDDING_MODEL}
      LLM_AGENT_PRESENTATION_MODEL: ${LLM_AGENT_PRESENTATION_MODEL}
      LLM_AGENT_HISTORY_RECENCY_WINDOW: ${LLM_AGENT_HISTORY_RECENCY_WINDOW}
      LLM_AGENT_RAG_QUERY_K: ${LLM_AGENT_RAG_QUERY_K}
      LLM_AGENT_PIPELINE_MODE: ${LLM_AGENT_PIPELINE_MODE}
      DESTINATION_MAPPING: ${DESTINATION_MAPPING}
    build-parameters:
      builder: custom
      commands:
        - npm ci --omit=dev --omit=optional
        - node -e "const fs=require('fs');for(const d of['tsx','@esbuild','esbuild']){fs.rmSync('node_modules/'+d,{recursive:true,force:true})};for(const f of['esbuild','tsx']){for(const ext of['','.cmd','.ps1']){fs.rmSync('node_modules/.bin/'+f+ext,{force:true})}}"
        - node -e "const fs=require('fs'),p=require('path');(function walk(dir){try{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const f=p.join(dir,e.name);if(e.isDirectory()){if(e.name==='docs'){fs.rmSync(f,{recursive:true,force:true})}else{walk(f)}}else if(e.name.endsWith('.map')||e.name.endsWith('.md')){fs.rmSync(f,{force:true})}}}catch{}})('node_modules')"
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          # Bind the destination to the SAME explicit named route declared above
          # (routes: ${APPROUTER_HOST}-srv). ${default-url} resolves to the CF
          # default generated route, which is NOT created when an explicit route
          # is set — so the approuter destination pointed at a dead host and all
          # /v1, /mcp and root calls 502'd while only static /chat/webapp loaded.
          srv-url: https://${APPROUTER_HOST}-srv.${CF_LANDSCAPE}
    requires:
      - name: cloud-llm-hub-auth
      - name: cloud-llm-hub-destination
      - name: cloud-llm-hub-connectivity
      - name: cloud-llm-hub-ai-core
  - name: cloud-llm-hub
    type: approuter.nodejs
    path: app/router
    parameters:
      disk-quota: 512M
      memory: 512M
      routes:
        - route: ${APPROUTER_HOST}.${CF_LANDSCAPE}
    properties:
      TENANT_HOST_PATTERN: "^(.*)-cloud-llm-hub.${CF_LANDSCAPE}"
    build-parameters:
      builder: custom
      commands:
        - npm install --production
        - node -e "require('fs').cpSync('../../app/chat/webapp','chat/webapp',{recursive:true})"
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 300000
      - name: cloud-llm-hub-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: cloud-llm-hub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cloud-llm-hub-${space-guid}
        tenant-mode: shared
    requires:
      - name: app-api
  - name: cloud-llm-hub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: cloud-llm-hub-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: cloud-llm-hub-analyst-consumer
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security-analyst-consumer.json
      config:
        xsappname: cloud-llm-hub-analyst-consumer-${space-guid}
        tenant-mode: shared
  - name: cloud-llm-hub-developer-consumer
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security-developer-consumer.json
      config:
        xsappname: cloud-llm-hub-developer-consumer-${space-guid}
        tenant-mode: shared
  - name: cloud-llm-hub-ai-core
    type: org.cloudfoundry.managed-service
    active: false
    optional: true
    parameters:
      service: aicore
      service-plan: extended
