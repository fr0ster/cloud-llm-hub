_schema-version: 3.3.0
ID: cloud-llm-hub
version: 3.3.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  # LLM Agent deployment parameters (values provided via .mtaext)
  LLM_AGENT_MODEL:
  LLM_AGENT_TEMPERATURE:
  LLM_AGENT_MAX_TOKENS:
  LLM_AGENT_MCP_DESTINATION:
  LLM_AGENT_MODE:
  LLM_AGENT_MAX_ITERATIONS:
  LLM_AGENT_RAG_TYPE:
  LLM_AGENT_RESOURCE_GROUP: "default"
  LLM_AGENT_CLASSIFIER_MODEL:
  LLM_AGENT_EMBEDDING_MODEL:
  LLM_AGENT_PRESENTATION_MODEL:
  LLM_AGENT_EXPOSITION: "readonly,high"
  # Force non-streaming mode (workaround for SAP AI Core streaming issues)
  FORCE_NON_STREAMING: "false"
  AICORE_AUTH_URL: ""
  AICORE_CLIENT_ID: ""
  AICORE_CLIENT_SECRET: ""
  AICORE_BASE_URL: ""
  # CF landscape and approuter route host (override in .mtaext per subaccount)
  CF_LANDSCAPE: "cfapps.eu10.hana.ondemand.com"
  APPROUTER_HOST: "cloud-llm-hub"
build-parameters:
  before-all:
    - builder: custom
      commands:
        - node -e "try{require('fs').rmSync('node_modules',{recursive:true,force:true,maxRetries:3,retryDelay:1000})}catch{}"
        - npm ci
        - npx cds build --production
        - node -e "require('fs').cpSync('app/chat/webapp','gen/srv/app/chat/webapp',{recursive:true})"
modules:
  - name: cloud-llm-hub-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    properties:
      # LLM Agent Configuration (values from .mtaext via global parameters)
      LLM_AGENT_MODEL: ${LLM_AGENT_MODEL}
      LLM_AGENT_TEMPERATURE: ${LLM_AGENT_TEMPERATURE}
      LLM_AGENT_MAX_TOKENS: ${LLM_AGENT_MAX_TOKENS}
      LLM_AGENT_MCP_DESTINATION: ${LLM_AGENT_MCP_DESTINATION}
      LLM_AGENT_MODE: ${LLM_AGENT_MODE}
      LLM_AGENT_MAX_ITERATIONS: ${LLM_AGENT_MAX_ITERATIONS}
      LLM_AGENT_RAG_TYPE: ${LLM_AGENT_RAG_TYPE}
      LLM_AGENT_RESOURCE_GROUP: ${LLM_AGENT_RESOURCE_GROUP}
      LLM_AGENT_CLASSIFIER_MODEL: ${LLM_AGENT_CLASSIFIER_MODEL}
      LLM_AGENT_EMBEDDING_MODEL: ${LLM_AGENT_EMBEDDING_MODEL}
      LLM_AGENT_PRESENTATION_MODEL: ${LLM_AGENT_PRESENTATION_MODEL}
      LLM_AGENT_EXPOSITION: ${LLM_AGENT_EXPOSITION}
      FORCE_NON_STREAMING: ${FORCE_NON_STREAMING}
      AICORE_AUTH_URL: ${AICORE_AUTH_URL}
      AICORE_CLIENT_ID: ${AICORE_CLIENT_ID}
      AICORE_CLIENT_SECRET: ${AICORE_CLIENT_SECRET}
      AICORE_BASE_URL: ${AICORE_BASE_URL}
    build-parameters:
      builder: custom
      commands:
        - npm ci --omit=dev --omit=optional
        - node -e "const fs=require('fs');for(const d of['tsx','@esbuild','esbuild']){fs.rmSync('node_modules/'+d,{recursive:true,force:true})};for(const f of['esbuild','tsx']){for(const ext of['','.cmd','.ps1']){fs.rmSync('node_modules/.bin/'+f+ext,{force:true})}}"
        - node -e "const fs=require('fs'),p=require('path');(function walk(dir){try{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const f=p.join(dir,e.name);if(e.isDirectory()){if(e.name==='docs'){fs.rmSync(f,{recursive:true,force:true})}else{walk(f)}}else if(e.name.endsWith('.map')||e.name.endsWith('.md')){fs.rmSync(f,{force:true})}}}catch{}})('node_modules')"
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: cloud-llm-hub-auth
      - name: cloud-llm-hub-destination
      - name: cloud-llm-hub-connectivity
      - name: cloud-llm-hub-ai-core
  - name: cloud-llm-hub
    type: approuter.nodejs
    path: app/router
    parameters:
      disk-quota: 256M
      memory: 256M
      routes:
        - route: ${APPROUTER_HOST}.${CF_LANDSCAPE}
    properties:
      TENANT_HOST_PATTERN: "^(.*)-cloud-llm-hub.${CF_LANDSCAPE}"
    build-parameters:
      builder: custom
      commands:
        - npm install --production
        - node -e "require('fs').cpSync('../../app/chat/webapp','chat/webapp',{recursive:true})"
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 300000
      - name: cloud-llm-hub-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: cloud-llm-hub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cloud-llm-hub-${space-guid}
        tenant-mode: shared
    requires:
      - name: app-api
  - name: cloud-llm-hub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: cloud-llm-hub-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: cloud-llm-hub-ai-core
    type: org.cloudfoundry.managed-service
    active: false
    optional: true
    parameters:
      service: aicore
      service-plan: extended