_schema-version: 3.3.0
ID: cloud-llm-hub
version: 1.2.1
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  # LLM Agent deployment parameters (provided via .mtaext)
  LLM_AGENT_MODEL:
  LLM_AGENT_TEMPERATURE:
  LLM_AGENT_MAX_TOKENS:
  LLM_AGENT_MCP_DESTINATION:
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --prefix submodules/mcp-abap-adt
        - npm run build --prefix submodules/mcp-abap-adt
        - npm ci --prefix submodules/llm-agent
        - npm run build --prefix submodules/llm-agent
        - npm ci
        - npx cds build --production
        - node tools/copy-mcp-submodule.js
        - node tools/copy-llm-agent-submodule.js
modules:
  - name: cloud-llm-hub-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      # Uncomment for hybrid debugging (development/test only!)
      # env:
      #   NODE_OPTIONS: "--inspect=0.0.0.0:9229"
      #   DEBUG: "*"
      env:
        # LLM Agent Configuration
        # These environment variables are set during deployment and used by Agent Service (OData)
        # Values are provided via mta-deploy.yaml (not committed to Git)
        # See mta-deploy.yaml.template for configuration template

        # NOTE: SAP AI Core access is via service binding (cloud-llm-hub-ai-core resource)
        # Service binding is configured in mta.yaml and provides credentials via VCAP_SERVICES
        # No destination is needed for SAP AI Core - service binding is used directly

        # LLM Model configuration
        # Model name determines which underlying provider SAP AI Core routes to:
        # - 'gpt-4o-mini', 'gpt-4o', 'gpt-4-turbo' → OpenAI
        # - 'claude-3-5-sonnet', 'claude-3-opus' → Anthropic
        # - 'deepseek-chat' → DeepSeek
        # Model must be configured in SAP AI Core Launchpad
        LLM_AGENT_MODEL: <LLM_AGENT_MODEL>

        # LLM Parameters
        LLM_AGENT_TEMPERATURE: <LLM_AGENT_TEMPERATURE>
        LLM_AGENT_MAX_TOKENS: <LLM_AGENT_MAX_TOKENS>

        # MCP Configuration
        # MCP destination for ABAP connection
        # This destination must be configured in Destination service (BTP Cockpit)
        # The destination should point to your ABAP system (same as MCP proxy uses)
        # MCP proxy will resolve this destination and create MCP server with SAP config
        LLM_AGENT_MCP_DESTINATION: <LLM_AGENT_MCP_DESTINATION>

        # MCP Proxy endpoint (optional)
        # If not set, will be auto-detected from request (for BTP) or use localhost (for local dev)
        # LLM_AGENT_MCP_ENDPOINT: ~{LLM_AGENT_MCP_ENDPOINT}
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: cloud-llm-hub-auth
      - name: cloud-llm-hub-destination
      - name: cloud-llm-hub-connectivity
      - name: cloud-llm-hub-ai-core
  - name: cloud-llm-hub
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: cloud-llm-hub-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: cloud-llm-hub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cloud-llm-hub-${space-guid}
        tenant-mode: shared
        oauth2-configuration:
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: cloud-llm-hub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: cloud-llm-hub-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
      config:
        connectorId: AA45023094B911E8B0C6F0E30A06C478
  - name: cloud-llm-hub-ai-core
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
      # SAP AI Core provides access to LLM providers (OpenAI, Anthropic, DeepSeek, etc.)
      # All LLM providers are accessed through SAP AI Core, not directly
      #
      # If AI Core service already exists in your subaccount, uncomment and set service-name:
      # service-name: your-existing-ai-core-service-name
      # This will bind to existing service instead of creating a new one
      #
      # The destination for AI Core should be configured in Destination service
