<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud LLM Hub - Chat Terminal</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0a0a0a; color: #00ff00; margin: 0; padding: 0; overflow: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .system-bar { background: #111; padding: 12px; border: 1px solid #333; margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 13px; border-radius: 4px; flex-wrap: wrap; gap: 8px; align-items: center; }
        #chat-window { flex: 1; overflow-y: auto; background: #000; padding: 20px; border: 1px solid #333; margin-bottom: 15px; border-radius: 4px; }
        .message { margin-bottom: 25px; border-bottom: 1px solid #1a1a1a; padding-bottom: 15px; }
        .user { color: #00bfff; font-weight: bold; font-size: 16px; }
        .agent { color: #e0e0e0; white-space: pre-wrap; font-size: 16px; line-height: 1.6; display: block; margin-top: 5px; }
        .thinking { color: #ffcc00; font-style: italic; animation: blink 1s infinite; font-size: 14px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .trace-container { margin-top: 15px; background: #0c0c0c; border: 1px solid #222; padding: 12px; border-left: 4px solid #ffcc00; border-radius: 2px; }
        .trace-header { font-weight: bold; color: #ffcc00; font-size: 11px; text-transform: uppercase; margin-bottom: 8px; }
        .trace-step { font-size: 13px; color: #aaa; margin: 8px 0; font-family: 'Consolas', monospace; }
        .trace-step b { color: #fff; }
        .trace-args { color: #666; font-size: 11px; display: block; margin-top: 2px; font-style: italic; }

        .stats-bar { margin-top: 10px; font-size: 12px; color: #888; display: flex; gap: 20px; padding: 6px 0; }
        .stats-bar .val { color: #ff00ff; font-weight: bold; }

        .input-area { display: flex; gap: 10px; padding-bottom: 10px; }
        #user-input { flex: 1; padding: 18px 20px; border: 2px solid #333; background: #111; color: #00ff00; outline: none; font-size: 18px; font-family: 'Courier New', Courier, monospace; border-radius: 6px; }
        #user-input:focus { border-color: #00ff00; }
        button { background: #1a1a1a; color: #00ff00; border: 2px solid #333; cursor: pointer; padding: 0 30px; font-weight: bold; font-size: 16px; border-radius: 6px; }
        button:hover:not(:disabled) { background: #00ff00; color: #000; }
        button:disabled, #user-input:disabled { opacity: 0.4; cursor: not-allowed; }
        #clear-btn { color: #ff5555; border-color: #552222; padding: 0 15px; font-size: 13px; }
        #clear-btn:hover:not(:disabled) { background: #ff5555; color: #000; }
        .status-connecting { color: #ffcc00; animation: blink 1s infinite; }
        .status-ready { color: #00ff00; }
        .status-error { color: #ff5555; }
        .status-streaming { color: #00bfff; animation: blink 1s infinite; }

        #llm-model-select, #dest-select, .aux-model-select {
            background: #111; color: #00ff00; border: 1px solid #333; font-family: 'Courier New', Courier, monospace;
            font-size: 13px; padding: 2px 4px; border-radius: 3px; outline: none; cursor: pointer;
        }
        #llm-model-select:focus, #dest-select:focus, .aux-model-select:focus { border-color: #00ff00; }
        #llm-model-select:disabled, #dest-select:disabled, .aux-model-select:disabled { opacity: 0.4; cursor: not-allowed; }

        pre code { display: block; background: #2d2d2d; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 13px; color: #e0e0e0; }
        code { background: #383838; padding: 2px 4px; border-radius: 3px; font-size: 13px; }

        /* File artifact cards */
        .file-card { margin: 12px 0; background: #0c0c0c; border: 1px solid #333; border-left: 4px solid #00bfff; border-radius: 4px; overflow: hidden; }
        .file-card-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #111; border-bottom: 1px solid #222; }
        .file-card-name { color: #00bfff; font-weight: bold; font-size: 13px; }
        .file-card-actions { display: flex; gap: 6px; }
        .file-card-btn { background: #1a1a1a; color: #00ff00; border: 1px solid #333; padding: 3px 10px; font-size: 11px; font-family: 'Courier New', monospace; cursor: pointer; border-radius: 3px; }
        .file-card-btn:hover { background: #00ff00; color: #000; }
        .file-card-preview { max-height: 200px; overflow: auto; padding: 10px 12px; font-size: 13px; color: #ccc; white-space: pre-wrap; font-family: 'Consolas', 'Courier New', monospace; }
        .file-card-preview iframe { border: none; width: 100%; height: 180px; background: #fff; border-radius: 2px; }
        .file-card-preview img { max-width: 100%; max-height: 180px; }
        .file-card-toggle { padding: 4px 12px; font-size: 11px; color: #555; cursor: pointer; user-select: none; border-top: 1px solid #222; }
        .file-card-toggle:hover { color: #888; }
        .file-card-body { display: none; }
        .file-card-body.open { display: block; }
        .mermaid-render { background: #fff; padding: 10px; border-radius: 2px; text-align: center; }
        .mermaid-render svg { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="system-bar">
            <span>LLM: <select id="llm-model-select" disabled><option value="">...</option></select></span>
            <span>MODE: <span id="agent-mode">...</span></span>
            <span>DEST: <select id="dest-select" disabled><option value="">...</option></select><button id="dest-refresh" title="Refresh destinations" style="margin-left:4px;padding:1px 6px;font-size:12px;cursor:pointer" disabled>&#x21bb;</button></span>
            <span>STATUS: <span id="status-text" class="status-connecting">CONNECTING...</span></span>
        </div>
        <div class="system-bar">
            <span>CLASSIFIER: <select id="classifier-model-select" class="aux-model-select" disabled><option value="">...</option></select></span>
            <span>EMBEDDER: <span id="embedding-model">...</span></span>
            <span>RAG: <span id="rag-type">...</span></span>
        </div>
        <div id="chat-window"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="root@cloud-llm-hub:~# TYPE YOUR MESSAGE" disabled autofocus
                   onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()" disabled>SEND</button>
            <button id="clear-btn" onclick="clearChat()">CLR</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statusText = document.getElementById('status-text');
        const modelSelect = document.getElementById('llm-model-select');
        const destSelect = document.getElementById('dest-select');
        const destRefreshBtn = document.getElementById('dest-refresh');
        const classifierSelect = document.getElementById('classifier-model-select');
        let conversationHistory = [];
        let ready = false;
        const sessionId = 'ui-' + crypto.randomUUID();

        // ---------------------------------------------------------------
        // File artifact helpers
        // ---------------------------------------------------------------
        const FILE_MIME_TYPES = {
            md: 'text/markdown', json: 'application/json', yaml: 'text/yaml',
            yml: 'text/yaml', xml: 'application/xml', csv: 'text/csv',
            html: 'text/html', svg: 'image/svg+xml', txt: 'text/plain',
            py: 'text/x-python', js: 'text/javascript', ts: 'text/typescript',
            abap: 'text/plain', sh: 'text/x-shellscript', css: 'text/css',
            png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
            gif: 'image/gif', mmd: 'text/plain',
        };
        const fileArtifacts = {};

        function getFileExt(path) {
            const dot = path.lastIndexOf('.');
            return dot >= 0 ? path.slice(dot + 1).toLowerCase() : 'txt';
        }

        function getFileMime(path) {
            return FILE_MIME_TYPES[getFileExt(path)] || 'text/plain';
        }

        function downloadBlob(filename, blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const basename = filename.split('/').pop() || filename;
            a.href = url; a.download = basename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        }

        function downloadArtifact(cardId) {
            const art = fileArtifacts[cardId];
            if (!art) return;
            try {
                if (art.encoding === 'base64') {
                    const bin = atob(art.content.replace(/\s/g, ''));
                    const bytes = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    downloadBlob(art.path, new Blob([bytes], { type: getFileMime(art.path) }));
                } else {
                    downloadBlob(art.path, new Blob([art.content], { type: getFileMime(art.path) }));
                }
            } catch (e) {
                console.error('Download failed:', e);
            }
        }

        function copyArtifact(cardId) {
            const art = fileArtifacts[cardId];
            if (art) navigator.clipboard.writeText(art.content);
        }

        function downloadMermaidSvg(renderId, filename) {
            const el = document.getElementById(renderId);
            const svg = el?.querySelector('svg');
            if (svg) downloadBlob(filename, new Blob([svg.outerHTML], { type: 'image/svg+xml' }));
        }

        let mermaidPromise = null;
        function ensureMermaid() {
            if (mermaidPromise) return mermaidPromise;
            mermaidPromise = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
                s.onload = () => { mermaid.initialize({ startOnLoad: false, theme: 'dark' }); resolve(); };
                s.onerror = (e) => { mermaidPromise = null; reject(e); };
                document.head.appendChild(s);
            });
            return mermaidPromise;
        }

        function buildFileCardHtml(attrs, content, cardId) {
            const path = attrs.path || 'file.txt';
            const encoding = attrs.encoding || '';
            const render = attrs.render || '';
            const ext = getFileExt(path);
            const trimmed = content.trim();
            let previewHtml = '';
            let extraButtons = '';

            if (encoding === 'base64') {
                const mime = getFileMime(path);
                if (mime.startsWith('image/')) {
                    previewHtml = '<img src="data:' + mime + ';base64,' + trimmed.replace(/\s/g, '') + '" alt="' + escapeHtml(path) + '">';
                } else {
                    previewHtml = '<span style="color:#888">[Binary file — ' + trimmed.length + ' chars base64]</span>';
                }
            } else if (render === 'mermaid') {
                previewHtml = '<div class="mermaid-render" id="mmd-' + cardId + '"><pre style="color:#888">Loading diagram...</pre></div>';
                extraButtons = '<button class="file-card-btn" onclick="downloadMermaidSvg(\'mmd-' + cardId + '\', \'' + escapeHtml(path.replace(/\.mmd$/, '.svg')) + '\')">SVG</button>';
            } else if (ext === 'svg' || ext === 'html') {
                previewHtml = '<iframe sandbox="" srcdoc="' + escapeHtml(trimmed) + '"></iframe>';
            } else {
                const lines = trimmed.split('\n');
                const preview = lines.slice(0, 30).join('\n');
                const trunc = lines.length > 30 ? '\n...' : '';
                previewHtml = escapeHtml(preview + trunc);
            }

            const bodyId = 'file-body-' + cardId;
            const copyBtn = encoding !== 'base64' ? '<button class="file-card-btn" onclick="copyArtifact(\'' + cardId + '\')">COPY</button>' : '';
            return '<div class="file-card">' +
                '<div class="file-card-header">' +
                    '<span class="file-card-name">' + escapeHtml(path) + '</span>' +
                    '<div class="file-card-actions">' + copyBtn + extraButtons +
                        '<button class="file-card-btn" onclick="downloadArtifact(\'' + cardId + '\')">DOWNLOAD</button>' +
                    '</div>' +
                '</div>' +
                '<div class="file-card-toggle" onclick="document.getElementById(\'' + bodyId + '\').classList.toggle(\'open\')">&#9654; Preview</div>' +
                '<div class="file-card-body" id="' + bodyId + '">' +
                    '<div class="file-card-preview">' + previewHtml + '</div>' +
                '</div>' +
            '</div>';
        }

        // ---------------------------------------------------------------
        // Streaming file artifact parser (state machine)
        // ---------------------------------------------------------------
        function createFileParser() {
            // States: 'passthrough' | 'buffering'
            let state = 'passthrough';
            let buf = '';        // accumulated buffer in BUFFERING state
            let tail = '';       // partial match tail in PASSTHROUGH state
            let cardCounter = 0;
            const BUFFER_LIMIT = 102400; // 100KB flush limit
            const TAG_START = '<file';
            const TAG_END = '</file>';

            // Segments: array of { type: 'text', value } | { type: 'card', cardId, attrs, content }
            const segments = [];
            let currentText = '';

            function flushText() {
                if (currentText) {
                    segments.push({ type: 'text', value: currentText });
                    currentText = '';
                }
            }

            function process(chunk) {
                const input = tail + chunk;
                tail = '';

                if (state === 'passthrough') {
                    let i = 0;
                    while (i < input.length) {
                        const idx = input.indexOf('<', i);
                        if (idx === -1) {
                            // No '<' found — check if tail could start a partial match
                            // Keep last 5 chars as potential partial '<file' start
                            const safe = input.length - 5;
                            if (safe > i) {
                                currentText += input.slice(i, safe);
                                tail = input.slice(safe);
                            } else {
                                tail = input.slice(i);
                            }
                            i = input.length;
                        } else {
                            // Output text before '<'
                            currentText += input.slice(i, idx);
                            const remaining = input.slice(idx);

                            // Check if this is '<file' or a partial start
                            if (remaining.length >= TAG_START.length) {
                                if (remaining.startsWith(TAG_START) && (remaining.length === TAG_START.length || /[\s>]/.test(remaining[TAG_START.length]))) {
                                    // Detected <file tag — check if inside code block
                                    const fullText = segments.map(s => s.type === 'text' ? s.value : '').join('') + currentText;
                                    const fenceCount = (fullText.match(/```/g) || []).length;
                                    if (fenceCount % 2 === 1) {
                                        // Inside code block — treat as literal
                                        currentText += '<';
                                        i = idx + 1;
                                        continue;
                                    }
                                    // Start buffering
                                    flushText();
                                    state = 'buffering';
                                    buf = remaining;
                                    i = input.length; // consumed everything
                                } else if (TAG_START.startsWith(remaining)) {
                                    // Partial match — save as tail for next chunk
                                    flushText();
                                    tail = remaining;
                                    i = input.length;
                                } else {
                                    // Not a file tag — output '<' and continue
                                    currentText += '<';
                                    i = idx + 1;
                                }
                            } else {
                                // Remaining could be partial — save as tail
                                if (TAG_START.startsWith(remaining)) {
                                    flushText();
                                    tail = remaining;
                                    i = input.length;
                                } else {
                                    currentText += '<';
                                    i = idx + 1;
                                }
                            }
                        }
                    }
                } else if (state === 'buffering') {
                    buf += input;

                    // Check for closing tag
                    const endIdx = buf.indexOf(TAG_END);
                    if (endIdx !== -1) {
                        const fileBlock = buf.slice(0, endIdx + TAG_END.length);
                        const after = buf.slice(endIdx + TAG_END.length);

                        // Parse the file block
                        const attrMatch = fileBlock.match(/^<file\s+([^>]*)>([\s\S]*)<\/file>$/);
                        if (attrMatch) {
                            const attrStr = attrMatch[1];
                            const content = attrMatch[2];
                            const attrs = {};
                            const attrRe = /(\w+)="([^"]*)"/g;
                            let m;
                            while ((m = attrRe.exec(attrStr)) !== null) attrs[m[1]] = m[2];
                            if (!attrs.path && attrs.name) attrs.path = attrs.name;

                            if (attrs.path) {
                                const cardId = 'art-' + Date.now() + '-' + (cardCounter++);
                                fileArtifacts[cardId] = {
                                    path: attrs.path,
                                    content: content.trim(),
                                    encoding: attrs.encoding || '',
                                    render: attrs.render || '',
                                };
                                segments.push({ type: 'card', cardId, attrs, content: content.trim() });
                            } else {
                                // No path — flush as text
                                currentText += escapeHtml(fileBlock);
                            }
                        } else {
                            currentText += escapeHtml(fileBlock);
                        }

                        // Process remaining after </file>
                        state = 'passthrough';
                        buf = '';
                        if (after) process(after);
                        return;
                    }

                    // Flush if buffer too large
                    if (buf.length > BUFFER_LIMIT) {
                        currentText += escapeHtml(buf);
                        buf = '';
                        state = 'passthrough';
                    }
                }
            }

            function finish() {
                // Flush any remaining state
                if (tail) { currentText += tail; tail = ''; }
                if (buf) { currentText += escapeHtml(buf); buf = ''; state = 'passthrough'; }
                flushText();
            }

            function render() {
                flushText();
                let html = '';
                const mermaidIds = [];
                // Merge consecutive text segments so code blocks split across
                // streaming chunks are processed as a single markdown string.
                const merged = [];
                for (const seg of segments) {
                    if (seg.type === 'text') {
                        const last = merged.length ? merged[merged.length - 1] : null;
                        if (last && last.type === 'text') {
                            last.value += seg.value;
                        } else {
                            merged.push({ type: 'text', value: seg.value });
                        }
                    } else {
                        merged.push(seg);
                    }
                }
                for (const seg of merged) {
                    if (seg.type === 'text') {
                        html += markdownToHtml(seg.value);
                    } else {
                        html += buildFileCardHtml(seg.attrs, seg.content, seg.cardId);
                        if (seg.attrs.render === 'mermaid') {
                            mermaidIds.push({ renderId: 'mmd-' + seg.cardId, content: seg.content });
                        }
                    }
                }
                return { html, mermaidIds };
            }

            return { process, finish, render };
        }

        async function renderMermaidDiagrams(mermaidIds) {
            if (mermaidIds.length === 0) return;
            await ensureMermaid();
            for (const { renderId, content } of mermaidIds) {
                try {
                    const { svg } = await mermaid.render('mmd-svg-' + renderId, content);
                    const el = document.getElementById(renderId);
                    if (el) el.innerHTML = '<div class="mermaid-render">' + svg + '</div>';
                } catch (e) {
                    const el = document.getElementById(renderId);
                    if (el) el.innerHTML = '<pre style="color:#ff4444">Mermaid error: ' + escapeHtml(e.message) + '</pre>';
                }
            }
        }

        function setStatus(text, cls) {
            statusText.innerText = text;
            statusText.className = cls;
        }

        function setInputEnabled(enabled) {
            userInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function markdownToHtml(text) {
            if (!text) return '';

            // Split into completed code blocks and non-code segments
            const parts = [];
            const codeBlockRe = /```(\w*)\n([\s\S]*?)```/g;
            let lastIdx = 0;
            let match;
            while ((match = codeBlockRe.exec(text)) !== null) {
                if (match.index > lastIdx) {
                    parts.push({ type: 'text', value: text.slice(lastIdx, match.index) });
                }
                parts.push({ type: 'code', lang: match[1], value: match[2].trim() });
                lastIdx = match.index + match[0].length;
            }
            if (lastIdx < text.length) {
                // Check for unclosed code block (streaming)
                const remainder = text.slice(lastIdx);
                const openFence = remainder.match(/```(\w*)\n([\s\S]*)$/);
                if (openFence) {
                    if (openFence.index > 0) {
                        parts.push({ type: 'text', value: remainder.slice(0, openFence.index) });
                    }
                    parts.push({ type: 'code', lang: openFence[1], value: openFence[2] });
                } else {
                    parts.push({ type: 'text', value: remainder });
                }
            }

            let html = '';
            for (const part of parts) {
                if (part.type === 'code') {
                    html += '<pre><code>' + escapeHtml(part.value) + '</code></pre>';
                } else {
                    let t = escapeHtml(part.value);
                    // Inline code
                    t = t.replace(/`([^`]+)`/g, (_, code) => '<code>' + code + '</code>');
                    // Headings
                    t = t.replace(/^### (.+)$/gm, '<strong style="font-size:14px">$1</strong><br>');
                    t = t.replace(/^## (.+)$/gm, '<strong style="font-size:15px">$1</strong><br>');
                    t = t.replace(/^# (.+)$/gm, '<strong style="font-size:16px">$1</strong><br>');
                    // Bold / italic
                    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                    t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                    // Lists
                    t = t.replace(/^[\-\*] (.+)$/gm, '&bull; $1<br>');
                    t = t.replace(/^\d+\. (.+)$/gm, '&bull; $1<br>');
                    // Links
                    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#00bfff">$1</a>');
                    // Line breaks
                    t = t.replace(/\n\n/g, '<br><br>');
                    t = t.replace(/\n/g, '<br>');
                    html += t;
                }
            }
            return html;
        }

        // Check model availability and agent readiness
        async function checkReady() {
            try {
                const resp = await fetch('/v1/models');
                const data = await resp.json();
                if (data.data && data.data.length > 0) {
                    const meta = data._meta || {};
                    const activeModel = data._active_model || data.data[0].id;
                    const agentReady = data._agent_ready === true;

                    // Populate model dropdown
                    modelSelect.innerHTML = '';
                    for (const m of data.data) {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.textContent = m.id;
                        if (m.id === activeModel) opt.selected = true;
                        modelSelect.appendChild(opt);
                    }
                    modelSelect.disabled = false;

                    document.getElementById('agent-mode').innerText = meta.mode || '?';
                    document.getElementById('rag-type').innerText = meta.rag_type || '?';
                    document.getElementById('embedding-model').innerText = meta.embedding_model || '?';

                    // Populate auxiliary model dropdowns with all available models
                    populateAuxSelect(classifierSelect, data.data, meta.classifier_model);

                    // Populate destination dropdown
                    const activeDest = data._active_destination || meta.mcp_destination || '';
                    const destinations = data._destinations || [];
                    if (destinations.length > 0) {
                        renderDestinations(destinations, activeDest);
                    } else {
                        destSelect.innerHTML = '';
                        const opt = document.createElement('option');
                        opt.value = activeDest;
                        opt.textContent = activeDest;
                        opt.selected = true;
                        destSelect.appendChild(opt);
                        destSelect.disabled = false;
                    }

                    if (!agentReady) {
                        // Agent is initializing (vectorization in progress) — keep polling
                        setStatus('INITIALIZING...', 'status-connecting');
                        setInputEnabled(false);
                        setTimeout(checkReady, 3000);
                        return;
                    }

                    ready = true;
                    setStatus('READY', 'status-ready');
                    setInputEnabled(true);
                    destRefreshBtn.disabled = false;
                    userInput.focus();
                    return;
                }
            } catch (e) { /* retry */ }
            setStatus('CONNECTING...', 'status-connecting');
            setTimeout(checkReady, 3000);
        }
        checkReady();

        // Periodically refresh destination statuses (background vectorization updates)
        setInterval(async () => {
            if (!ready) return;
            try {
                const resp = await fetch('/v1/models');
                const data = await resp.json();
                const destinations = data._destinations || [];
                const activeDest = data._active_destination || '';
                if (destinations.length > 0) {
                    renderDestinations(destinations, activeDest);
                }
            } catch (e) { /* ignore */ }
        }, 15000);

        // Manual destination refresh button
        destRefreshBtn.addEventListener('click', async () => {
            destRefreshBtn.disabled = true;
            destRefreshBtn.textContent = '...';
            try {
                const resp = await fetch('/v1/destinations/refresh', { method: 'POST' });
                const data = await resp.json();
                const destinations = data.destinations || [];
                if (destinations.length > 0) {
                    const activeDest = destSelect.value || '';
                    renderDestinations(destinations, activeDest);
                }
            } catch (e) { /* ignore */ }
            destRefreshBtn.textContent = '\u21bb';
            destRefreshBtn.disabled = false;
        });

        function populateAuxSelect(selectEl, models, activeValue) {
            const currentVal = selectEl.value || activeValue;
            selectEl.innerHTML = '';
            for (const m of models) {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.id;
                if (m.id === currentVal) opt.selected = true;
                selectEl.appendChild(opt);
            }
            // If active value not in models list, add it
            if (activeValue && !Array.from(selectEl.options).some(o => o.value === activeValue)) {
                const opt = document.createElement('option');
                opt.value = activeValue;
                opt.textContent = activeValue;
                opt.selected = true;
                selectEl.prepend(opt);
            }
            selectEl.disabled = false;
        }

        function clearChat() {
            Object.keys(fileArtifacts).forEach(k => delete fileArtifacts[k]);
            conversationHistory = [];
            chatWindow.innerHTML = '';
        }

        function getSelectedModel() {
            return modelSelect.value || undefined;
        }

        function getSelectedDestination() {
            return destSelect.value || undefined;
        }

        function renderDestinations(destinations, activeDest) {
            if (!destinations || destinations.length === 0) return;
            const currentVal = destSelect.value || activeDest;
            destSelect.innerHTML = '';
            for (const d of destinations) {
                const opt = document.createElement('option');
                opt.value = d.name;
                const icon = d.status === 'ready' ? '\u2713'
                    : d.status === 'vectorizing' ? '\u23F3'
                    : d.status === 'pending' ? '\u2022'
                    : '\u2717';
                const label = d.status === 'ready' ? `${d.toolCount}t`
                    : d.status === 'vectorizing' ? 'vectorizing...'
                    : d.status === 'pending' ? 'pending'
                    : 'error';
                opt.textContent = `${d.name} [${icon} ${label}]`;
                if (d.name === currentVal) opt.selected = true;
                if (d.status !== 'ready') opt.disabled = true;
                destSelect.appendChild(opt);
            }
            destSelect.disabled = false;
        }

        async function sendMessage() {
            if (!ready) return;
            const text = userInput.value.trim();
            if (!text) return;

            chatWindow.innerHTML += `<div class="message user"><b>> USER:</b> ${escapeHtml(text)}</div>`;
            userInput.value = '';
            setInputEnabled(false);

            conversationHistory.push({ role: 'user', content: text });

            const thinkingId = 'thinking-' + Date.now();
            chatWindow.innerHTML += `<div class="message" id="${thinkingId}"><span class="thinking">> SYSTEM: AGENT IS PROCESSING...</span></div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            let assistantContent = '';
            let toolCalls = [];
            let externalToolCalls = [];
            const toolCallNames = new Set();
            let usage = null;
            const t0 = Date.now();

            // Single timer for elapsed seconds in status bar
            const elapsed = () => ((Date.now() - t0) / 1000).toFixed(0);
            let phase = 'PROCESSING';
            setStatus(`${phase} 0s`, 'status-connecting');
            const timer = setInterval(() => {
                const cls = phase === 'STREAMING' ? 'status-streaming' : 'status-connecting';
                setStatus(`${phase} ${elapsed()}s`, cls);
            }, 1000);

            function stopTimer() { clearInterval(timer); }

            try {
                const reqBody = {
                    messages: [{ role: 'user', content: text }],
                    stream: true,
                    stream_options: { include_usage: true },
                    tools: [
                        {
                            type: 'function',
                            function: {
                                name: 'GenerateFile',
                                description: 'Generate a file for the user to download. Use when the user asks to create, generate, export, or save content as a file. Supports text files (markdown, code, JSON, YAML, XML, CSV, etc.), SVG/HTML, Mermaid diagrams (use .mmd extension), and base64-encoded binary content.',
                                parameters: {
                                    type: 'object',
                                    properties: {
                                        path: { type: 'string', description: 'Filename with extension (e.g. "analysis.md", "diagram.mmd")' },
                                        content: { type: 'string', description: 'File content as text, or base64 string for binary files' },
                                        encoding: { type: 'string', enum: ['text', 'base64'], description: 'Content encoding. Default: text' },
                                        render: { type: 'string', enum: ['mermaid'], description: 'Special rendering hint. Use "mermaid" for .mmd files' }
                                    },
                                    required: ['path', 'content']
                                }
                            }
                        }
                    ]
                };
                const selectedModel = getSelectedModel();
                if (selectedModel) reqBody.model = selectedModel;
                if (classifierSelect.value) reqBody.classifier_model = classifierSelect.value;
                // Send only current message — SmartAgent manages session history internally
                const headers = { 'Content-Type': 'application/json', 'X-Session-Id': sessionId };
                const selectedDest = getSelectedDestination();
                if (selectedDest) headers['X-SAP-Destination'] = selectedDest;

                const response = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(reqBody)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    // Parse JSON error for user-friendly message
                    try {
                        const errJson = JSON.parse(errText);
                        if (errJson.error && errJson.error.message) {
                            throw new Error(errJson.error.message);
                        }
                    } catch (parseErr) {
                        if (parseErr.message && !parseErr.message.startsWith('HTTP')) throw parseErr;
                    }
                    throw new Error('HTTP ' + response.status + ': ' + errText);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                phase = 'STREAMING';
                const fileParser = createFileParser();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop() || '';

                    for (const part of parts) {
                        for (const line of part.split('\n')) {
                            const trimmed = line.trim();
                            if (!trimmed || trimmed.charAt(0) === ':') continue;
                            if (trimmed === 'data: [DONE]') continue;
                            if (!trimmed.startsWith('data: ')) continue;

                            try {
                                const data = JSON.parse(trimmed.substring(6));

                                if (data.error && data.error.message) throw new Error(data.error.message);
                                if (data.usage) usage = data.usage;
                                if (!data.choices || !data.choices.length) continue;

                                const delta = data.choices[0].delta || {};

                                if (delta.content) {
                                    assistantContent += delta.content;
                                    // Detect internal tool executions from content
                                    const execMatch = delta.content.match(/\[SmartAgent: Executing (\w+)\.\.\.\]/);
                                    if (execMatch) {
                                        const toolName = execMatch[1];
                                        toolCalls.push({ name: toolName, arguments: '' });
                                        toolCallNames.add(toolName);
                                        phase = 'TOOL: ' + toolName;
                                    }
                                    fileParser.process(delta.content);
                                    const el = document.getElementById(thinkingId);
                                    if (el) {
                                        const { html } = fileParser.render();
                                        el.innerHTML = '<span class="agent"><b>> AGENT:</b> ' + html + '</span>';
                                        chatWindow.scrollTop = chatWindow.scrollHeight;
                                    }
                                }

                                if (delta.tool_calls && delta.tool_calls.length) {
                                    for (const tc of delta.tool_calls) {
                                        const idx = tc.index != null ? tc.index : externalToolCalls.length;
                                        if (!externalToolCalls[idx]) externalToolCalls[idx] = { name: '', arguments: '' };
                                        if (tc.function) {
                                            if (tc.function.name) externalToolCalls[idx].name += tc.function.name;
                                            if (tc.function.arguments) externalToolCalls[idx].arguments += tc.function.arguments;
                                        }
                                    }
                                    phase = 'TOOL CALL';
                                }
                            } catch (parseErr) {
                                if (parseErr.message && !parseErr.message.includes('JSON')) throw parseErr;
                            }
                        }
                    }
                }

                stopTimer();

                // Process GenerateFile tool calls from external tool calls
                const generateFileCalls = [];
                for (const tc of externalToolCalls) {
                    if (tc.name === 'GenerateFile') {
                        try {
                            const args = JSON.parse(tc.arguments);
                            if (args.path && args.content) {
                                const cardId = 'art-' + Date.now() + '-' + (generateFileCalls.length);
                                fileArtifacts[cardId] = {
                                    path: args.path,
                                    content: args.content,
                                    encoding: args.encoding || '',
                                    render: args.render || '',
                                };
                                generateFileCalls.push({ cardId, attrs: args, content: args.content });
                            }
                        } catch (e) { /* ignore malformed args */ }
                    }
                }

                if (assistantContent) {
                    conversationHistory.push({ role: 'assistant', content: assistantContent });
                }

                const placeholder = document.getElementById(thinkingId);
                let toolsHtml = '';
                const namedTools = toolCalls.filter(t => t.name);
                if (namedTools.length > 0) {
                    // Group by tool name and show call count
                    const toolCountMap = new Map();
                    for (const tc of namedTools) {
                        toolCountMap.set(tc.name, (toolCountMap.get(tc.name) || 0) + 1);
                    }
                    const stepsHtml = [...toolCountMap.entries()].map(([name, count]) => {
                        const countLabel = count > 1 ? ` <span style="color:#888">&times;${count}</span>` : '';
                        return `<div class="trace-step"><b>${escapeHtml(name)}</b>${countLabel}</div>`;
                    }).join('');
                    toolsHtml = `<div class="trace-container"><div class="trace-header">Tool Calls (${namedTools.length})</div>${stepsHtml}</div>`;
                }

                const durationSec = ((Date.now() - t0) / 1000).toFixed(1);
                let usageHtml = `<div class="stats-bar"><span>TIME: <span class="val">${durationSec}s</span></span>`;
                if (usage) {
                    const total = (usage.prompt_tokens || 0) + (usage.completion_tokens || 0);
                    usageHtml += `<span>TOKENS: <span class="val">${total}</span> (in: ${usage.prompt_tokens || 0} / out: ${usage.completion_tokens || 0})</span>`;
                }
                if (namedTools.length > 0) {
                    usageHtml += `<span>TOOLS: <span class="val">${toolCallNames.size} unique / ${namedTools.length} calls</span></span>`;
                }
                usageHtml += '</div>';

                if (placeholder) {
                    fileParser.finish();
                    const { html: finalHtml, mermaidIds } = fileParser.render();

                    // Build file artifact cards from GenerateFile tool calls
                    let fileCardsHtml = '';
                    const fileMermaidIds = [];
                    for (const fc of generateFileCalls) {
                        fileCardsHtml += buildFileCardHtml(fc.attrs, fc.content, fc.cardId);
                        if (fc.attrs.render === 'mermaid') {
                            fileMermaidIds.push({ renderId: 'mmd-' + fc.cardId, content: fc.content });
                        }
                    }

                    placeholder.innerHTML = `
                        <span class="agent"><b>> AGENT:</b> ${finalHtml || '<em style="color:#888">No response</em>'}</span>
                        ${fileCardsHtml}${toolsHtml}${usageHtml}
                    `;
                    placeholder.className = 'message';
                    const allMermaidIds = [...mermaidIds, ...fileMermaidIds];
                    if (allMermaidIds.length > 0) renderMermaidDiagrams(allMermaidIds);
                }

            } catch (e) {
                stopTimer();
                const durationSec = ((Date.now() - t0) / 1000).toFixed(1);
                const placeholder = document.getElementById(thinkingId);
                if (placeholder) {
                    placeholder.innerHTML = `<span style="color:#ff5555"><b>> ERROR:</b> ${escapeHtml(e.message)}</span>
                        <div class="stats-bar"><span>TIME: <span class="val">${durationSec}s</span></span></div>`;
                    placeholder.className = 'message';
                }
                setStatus('ERROR', 'status-error');
                setInputEnabled(true);
                userInput.focus();
                chatWindow.scrollTop = chatWindow.scrollHeight;
                return;
            }

            setStatus('READY', 'status-ready');
            setInputEnabled(true);
            userInput.focus();
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
