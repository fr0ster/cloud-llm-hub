_schema-version: 3.3.0
ID: cloud-llm-hub-staging
version: 3.8.0-rc
description: "Cloud LLM Hub — staging instance for testing new features"
parameters:
  enable-parallel-deployments: true
  LLM_AGENT_PROVIDER: "sap-ai-sdk"
  LLM_AGENT_MODEL:
  LLM_AGENT_TEMPERATURE:
  LLM_AGENT_API_KEY: ""
  LLM_AGENT_BASE_URL: ""
  LLM_AGENT_MAX_TOKENS:
  LLM_AGENT_MCP_DESTINATION:
  LLM_AGENT_MODE:
  LLM_AGENT_MAX_ITERATIONS:
  LLM_AGENT_RAG_TYPE:
  LLM_AGENT_RESOURCE_GROUP: "default"
  LLM_AGENT_CLASSIFIER_MODEL:
  LLM_AGENT_EMBEDDING_MODEL:
  LLM_AGENT_PRESENTATION_MODEL:
  LLM_AGENT_EXPOSITION: "readonly,high"
  LLM_AGENT_HISTORY_RECENCY_WINDOW:
  LLM_AGENT_RAG_QUERY_K:
  LLM_AGENT_PIPELINE_MODE: "default"
  DESTINATION_MAPPING: ""
  AICORE_AUTH_URL: ""
  AICORE_CLIENT_ID: ""
  AICORE_CLIENT_SECRET: ""
  AICORE_BASE_URL: ""
  CF_LANDSCAPE: "eu10"
  APPROUTER_HOST: "cloud-llm-hub-staging"

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
        - node -e "require('fs').cpSync('app/chat/webapp','gen/srv/app/chat/webapp',{recursive:true})"
modules:
  - name: cloud-llm-hub-staging-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    properties:
      LLM_AGENT_PROVIDER: ${LLM_AGENT_PROVIDER}
      LLM_AGENT_MODEL: ${LLM_AGENT_MODEL}
      LLM_AGENT_API_KEY: ${LLM_AGENT_API_KEY}
      LLM_AGENT_BASE_URL: ${LLM_AGENT_BASE_URL}
      LLM_AGENT_TEMPERATURE: ${LLM_AGENT_TEMPERATURE}
      LLM_AGENT_MAX_TOKENS: ${LLM_AGENT_MAX_TOKENS}
      LLM_AGENT_MCP_DESTINATION: ${LLM_AGENT_MCP_DESTINATION}
      LLM_AGENT_MODE: ${LLM_AGENT_MODE}
      LLM_AGENT_MAX_ITERATIONS: ${LLM_AGENT_MAX_ITERATIONS}
      LLM_AGENT_RAG_TYPE: ${LLM_AGENT_RAG_TYPE}
      LLM_AGENT_RESOURCE_GROUP: ${LLM_AGENT_RESOURCE_GROUP}
      LLM_AGENT_CLASSIFIER_MODEL: ${LLM_AGENT_CLASSIFIER_MODEL}
      LLM_AGENT_EMBEDDING_MODEL: ${LLM_AGENT_EMBEDDING_MODEL}
      LLM_AGENT_PRESENTATION_MODEL: ${LLM_AGENT_PRESENTATION_MODEL}
      LLM_AGENT_EXPOSITION: ${LLM_AGENT_EXPOSITION}
      LLM_AGENT_HISTORY_RECENCY_WINDOW: ${LLM_AGENT_HISTORY_RECENCY_WINDOW}
      LLM_AGENT_RAG_QUERY_K: ${LLM_AGENT_RAG_QUERY_K}
      LLM_AGENT_PIPELINE_MODE: ${LLM_AGENT_PIPELINE_MODE}
      DESTINATION_MAPPING: ${DESTINATION_MAPPING}
      AICORE_AUTH_URL: ${AICORE_AUTH_URL}
      AICORE_CLIENT_ID: ${AICORE_CLIENT_ID}
      AICORE_CLIENT_SECRET: ${AICORE_CLIENT_SECRET}
      AICORE_BASE_URL: ${AICORE_BASE_URL}
    build-parameters:
      builder: npm
      ignore:
        - node_modules/
        - default-env.json
    provides:
      - name: staging-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: cloud-llm-hub-staging-auth
      - name: cloud-llm-hub-staging-destination
      - name: cloud-llm-hub-staging-connectivity
      - name: cloud-llm-hub-staging-ai-core

  - name: cloud-llm-hub-staging
    type: approuter.nodejs
    path: app/router
    parameters:
      disk-quota: 256M
      memory: 64M
      routes:
        - route: ${APPROUTER_HOST}.cfapps.${CF_LANDSCAPE}.hana.ondemand.com
    properties:
      TENANT_HOST_PATTERN: "^(.*)-cloud-llm-hub-staging.cfapps.${CF_LANDSCAPE}.hana.ondemand.com"
    build-parameters:
      builder: custom
      commands:
        - npm ci --omit=dev
        - node -e "require('fs').cpSync('../../app/chat/webapp','chat/webapp',{recursive:true})"
    requires:
      - name: cloud-llm-hub-staging-auth
      - name: staging-srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: cloud-llm-hub-staging-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security-staging.json

  - name: cloud-llm-hub-staging-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: cloud-llm-hub-staging-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: cloud-llm-hub-staging-ai-core
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
    active: false
