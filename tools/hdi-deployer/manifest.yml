# Throwaway HDI deployer, pushed by tools/deploy-hdi-tables.sh. ((hdi_service)) and
# ((app_name)) are filled in with `cf push --var`.
applications:
  - name: ((app_name))
    memory: 256M
    no-route: true
    health-check-type: process
    buildpacks:
      - nodejs_buildpack
    command: npm start; sleep 3600
    services:
      - ((hdi_service))
